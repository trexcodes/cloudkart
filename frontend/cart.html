<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudKart | Cart</title>

    <link rel="stylesheet" href="css/cart.css">
</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo">
            <h2>☁️ CloudKart</h2>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="cart.html">🛒</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>
</header>

<section class="cart">

    <h1>🛒 Your Shopping Cart</h1>

    <div class="cart-item">

        <img src="images/laptop.png" alt="Laptop">

        <div class="cart-details">
            <h3>Gaming Laptop</h3>
            <p>$999</p>

            <div class="quantity">
                <button>-</button>
                <span>1</span>
                <button>+</button>
            </div>
        </div>

        <button class="remove-btn">Remove</button>

    </div>

    <div class="checkout">

        <h2>Total: $999</h2>

        <button class="checkout-btn">
            Proceed to Checkout
        </button>

    </div>

</section>

</body>
</html>
