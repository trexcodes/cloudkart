<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudKart | Login</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">
            ☁️ CloudKart
        </div>

        <ul class="nav-links">

            <li><a href="index.html">Home</a></li>

            <li><a href="products.html">Products</a></li>

            <li><a href="cart.html">🛒 Cart</a></li>

            <li><a href="register.html">Register</a></li>

            <li><a href="login.html" class="active">Login</a></li>

        </ul>

    </nav>

</header>

<div class="login-container">

    <div class="login-box">

        <h1>Welcome Back 👋</h1>

        <p>Login to continue shopping on CloudKart.</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <div class="options">

                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button type="submit">

                Login

            </button>

        </form>

        <div class="register">

            Don't have an account?

            <a href="register.html">

                Create Account

            </a>

        </div>

    </div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
